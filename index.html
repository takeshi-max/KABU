<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌐 統合資産 AIアナリスト Pro</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 550px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
    
    .card { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    h2 { font-size: 20px; margin: 0 0 15px; text-align: center; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    label { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 5px; display: block; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; outline: none; transition: 0.2s; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,0.2); }
    
    button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 0 #0369a1; }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { background: #475569; box-shadow: none; cursor: not-allowed; opacity: 0.7; }
    
    .result-box { white-space: pre-wrap; font-size: 14px; line-height: 1.7; color: #e2e8f0; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .loading { color: #38bdf8; font-weight: bold; text-align: center; display: none; padding: 10px; }
    .status-msg { font-size: 10px; color: #64748b; text-align: center; margin-top: 5px; height: 1.2em; }
    
    .disclaimer { font-size: 10px; color: #94a3b8; margin-top: 15px; border-top: 1px dashed #334155; padding-top: 10px; line-height: 1.4; }
    .example-tag { font-size: 11px; color: #64748b; margin-bottom: 10px; background: #0f172a; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🌐 統合資産 AIアナリスト</h2>
    
    <label>Google Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AI StudioのAPIキーを入力" />
    
    <label>分析したい銘柄・ファンド</label>
    <input type="text" id="searchInput" placeholder="銘柄コード、企業名、シンボル" />
    
    <div class="example-tag">
      💡 入力例:<br>
      ・7203 (トヨタ) / AAPL (アップル)<br>
      ・オルカン / eMAXIS Slim 米国株式 / S&P500
    </div>
    
    <button id="searchBtn" onclick="startAnalysis()">AIで多角分析を開始</button>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="loading" class="loading">🔍 最新データを日本語で分析中...</div>
    <div id="result" class="result-box"></div>
    <div class="disclaimer">
      【免責事項】本アプリはAIによる情報提供を目的としており、投資勧誘ではありません。情報の正確性、完全性を保証するものではなく、投資による損失について作者は一切の責任を負いません。最終的な投資判断はご自身で行ってください。
    </div>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  // 以前のアプリとキーを混同しないようユニークな名前で保存
  apiKeyInput.value = localStorage.getItem('asset_analyst_gemini_key') || '';
  apiKeyInput.addEventListener('change', () => {
    localStorage.setItem('asset_analyst_gemini_key', apiKeyInput.value.trim());
  });

  async function startAnalysis() {
    const apiKey = apiKeyInput.value.trim();
    const query = document.getElementById('searchInput').value.trim();
    const resultBox = document.getElementById('result');
    const resultCard = document.getElementById('resultCard');
    const loading = document.getElementById('loading');
    const searchBtn = document.getElementById('searchBtn');
    const statusMsg = document.getElementById('statusMsg');

    if (!apiKey) return alert("Gemini APIキーを入力してください！");
    if (!query) return alert("銘柄名やコードを入力してください！");

    searchBtn.disabled = true;
    resultCard.style.display = 'block';
    loading.style.display = 'block';
    resultBox.innerText = '';
    statusMsg.textContent = "AIモデルを確認中...";

    // プロンプトの改良（日本語出力を強力に強制）
    const prompt = `あなたはプロの金融アナリストです。以下の入力について、必ず【全て日本語】で詳細なレポートを作成してください。

入力: 「${query}」

【レポート構成】
1. 分析対象の特定
   - 日本株 / 米国株 / 投資信託 のどれに該当するか
   - 正式名称、コード、またはティッカー

2. 概要と基本特徴
   - 事業内容や運用の仕組みを専門用語を噛み砕いて日本語で解説

3. 主な強み・ポジティブ要素
   - 競合優位性や今後の成長期待などを日本語で箇条書き

4. 主なリスク・懸念点
   - 市場リスクや財務上の注意点を日本語で箇条書き

5. 投資検討のチェックポイント
   - 今後どの指標やニュースを注視すべきか

※回答はすべて日本語で行うこと。英語で出力された場合はエラーとみなします。投資助言（買い・売りの推奨）は含めないでください。`;

    try {
      // 1. 利用可能なモデルリストを取得
      const modelsResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const modelsData = await modelsResponse.json();
      
      if (!modelsResponse.ok) throw new Error(modelsData.error?.message || "API接続エラー");

      // generateContentに対応したモデルを抽出
      let availableModels = modelsData.models
        .filter(m => m.supportedGenerationMethods.includes("generateContent"))
        .sort((a, b) => b.name.localeCompare(a.name));

      // 記憶している成功モデルを最優先にする
      const lastModel = localStorage.getItem('last_asset_success_model');
      if (lastModel && availableModels.some(m => m.name === lastModel)) {
        availableModels = [ {name: lastModel}, ...availableModels.filter(m => m.name !== lastModel) ];
      }

      let success = false;

      // 2. 成功するまでしらみつぶしに試行
      for (const modelObj of availableModels) {
        const modelName = modelObj.name;
        statusMsg.textContent = `試行中: ${modelName.split('/').pop()}...`;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });

          if (response.ok) {
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (text) {
              resultBox.innerText = text;
              localStorage.setItem('last_asset_success_model', modelName); // 成功モデルを記憶
              success = true;
              break;
            }
          }
        } catch (e) {
          console.warn(`${modelName} でエラー:`, e);
          continue;
        }
      }

      if (!success) throw new Error("利用可能なAIモデルが見つからなかったか、無料枠の制限です。");

    } catch (err) {
      resultBox.innerText = "エラーが発生しました:\n" + err.message;
    } finally {
      loading.style.display = 'none';
      searchBtn.disabled = false;
      statusMsg.textContent = success ? "分析完了" : "失敗";
    }
  }
</script>

</body>
</html>
