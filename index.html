<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌐 統合資産 AIアナリスト</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .result-box { white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #e2e8f0; }
    .loading { color: #38bdf8; font-weight: bold; text-align: center; display: none; }
    .disclaimer { font-size: 10px; color: #94a3b8; margin-top: 10px; border-top: 1px dashed #334155; padding-top: 8px; }
    .example-tag { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🌐 統合資産 AIアナリスト</h2>
    <input type="password" id="apiKey" placeholder="Gemini API Keyを入力" />
    <input type="text" id="searchInput" placeholder="銘柄コード、企業名、ファンド名を入力" />
    <div class="example-tag">
      入力例: 7203 / トヨタ / AAPL / アップル / オルカン / S&P500
    </div>
    <button id="searchBtn" onclick="analyzeAsset()"> AIで多角分析する</button>
  </div>

  <div class="card">
    <div id="loading" class="loading">🔍 銘柄・ファンド情報を検索＆分析中...</div>
    <div id="result" class="result-box">日本株・米国株・投資信託を入力して「分析する」を押してください。</div>
    <div class="disclaimer">※本アプリの提供情報はAIによる自動分析であり、投資勧誘を目的としたものではありません。投資の最終決定はご自身の判断で行ってください。</div>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('multi_asset_gemini_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('multi_asset_gemini_key', apiKeyInput.value.trim()));

  async function analyzeAsset() {
    const apiKey = apiKeyInput.value.trim();
    const query = document.getElementById('searchInput').value.trim();
    const resultBox = document.getElementById('result');
    const loading = document.getElementById('loading');
    const searchBtn = document.getElementById('searchBtn');

    if (!apiKey) return alert("Gemini APIキーを入力してください！");
    if (!query) return alert("検索キーワードを入力してください！");

    loading.style.display = 'block';
    resultBox.innerHTML = '';
    searchBtn.disabled = true;

    // AIに種類判別と分析を同時に行わせるプロンプト
    const prompt = `あなたは優秀な金融アナリストです。
入力された検索ワード「${query}」について、以下の手順で処理・出力してください。

【ステップ1】検索ワードが「日本株」「米国株」「投資信託」のどれに該当するか特定してください。
【ステップ2】種類に応じて以下の構成でレポートを作成してください（Markdown形式）。

---
### ■ 分析対象
【分類】（日本株 / 米国株 / 投資信託のいずれか）
【正式名称】（コードまたはティッカーシンボル）

### 1. 概要と基本特徴
（特徴や投資対象、事業内容を2〜3行で）

### 2. 主なポジティブ要素・強み
* 
* 

### 3. 主なリスク・懸念点
* 
* 

### 4. 投資検討のチェックポイント
* 

---
※具体的な買え/売れといった投資助言は絶対に含めないでください。`;

    const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
    let success = false;

    for (const model of models) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        if (!response.ok) continue;

        const data = await response.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (text) {
          resultBox.innerText = text;
          success = true;
          break;
        }
      } catch (e) {
        console.error(e);
      }
    }

    loading.style.display = 'none';
    searchBtn.disabled = false;

    if (!success) {
      resultBox.innerText = "エラー: 情報の取得に失敗しました。APIキーまたはネットワーク接続を確認してください。";
    }
  }
</script>

</body>
</html>
