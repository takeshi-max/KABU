<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌐 統合資産 AIアナリスト Pro (リアルタイム版)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: sans-serif; background: #090d16; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
    .card { background: #111827; border-radius: 16px; padding: 20px; border: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { font-size: 20px; margin: 0 0 15px; text-align: center; color: #38bdf8; }
    label { font-size: 11px; color: #9ca3af; font-weight: bold; margin-bottom: 5px; display: block; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #374151; background: #1f2937; color: white; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 16px; background: #0284c7; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 0 #0369a1; }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { background: #4b5563; box-shadow: none; cursor: not-allowed; }
    .result-box { white-space: pre-wrap; font-size: 14px; line-height: 1.8; color: #f3f4f6; animation: fadeIn 0.5s ease; }
    .shikiho-tag { background: #1e3a8a; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .loading { color: #38bdf8; font-weight: bold; text-align: center; display: none; padding: 10px; }
    .status-msg { font-size: 10px; color: #6b7280; text-align: center; margin-top: 5px; }
    .disclaimer { font-size: 10px; color: #6b7280; margin-top: 20px; border-top: 1px solid #1f2937; padding-top: 10px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🌐 統合資産 AIアナリスト Pro</h2>
    <label>Google Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AI StudioのAPIキー" />
    <label>銘柄・ファンドを検索</label>
    <input type="text" id="searchInput" placeholder="例: セコム, 9735, トヨタ, NVDA" />
    <button id="searchBtn" onclick="startAnalysis()">🌐 Google検索 & 多角分析</button>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="loading" class="loading">📡 インターネットから最新情報を取得中...</div>
    <div id="result" class="result-box"></div>
    <div class="disclaimer">※AI検索結果に基づきます。投資の最終判断は自己責任でお願いします。</div>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('asset_success_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('asset_success_key', apiKeyInput.value.trim()));

  async function startAnalysis() {
    const apiKey = apiKeyInput.value.trim();
    const query = document.getElementById('searchInput').value.trim();
    if (!apiKey || !query) return alert("入力が不足しています");

    const searchBtn = document.getElementById('searchBtn');
    const resultCard = document.getElementById('resultCard');
    const resultBox = document.getElementById('result');
    const loading = document.getElementById('loading');
    const statusMsg = document.getElementById('statusMsg');

    searchBtn.disabled = true;
    resultCard.style.display = 'block';
    loading.style.display = 'block';
    resultBox.innerText = '';
    statusMsg.textContent = "最新モデルを起動中...";

    // 検索機能(google_search)を有効化したプロンプト
    const prompt = `あなたは日本の投資専門家です。入力「${query}」について、ネット検索を駆使して【全て日本語】で回答してください。
必ず以下の構成を守ってください。

### ■ 基本情報
【銘柄名】
【株価】（現在の株価または最新の基準価額）
【特色】（どんな事業か。四季報風に）

### ■ 決算・業績状況
- 直近の決算発表の結果（売上・利益の増減）
- 財務の健全性

### ■ 今後の動向とAI予想
- 【業績予想】（今後の見通し。四季報の【絶好調】【反落】のような見出しを付けて解説）
- 成長の鍵となる材料や新事業
- 懸念されるリスク要因

### ■ アナリストの視点
- どのような投資家に向いているか
- 注目すべきテクニカル・ファンダメンタルズのポイント

※全て日本語で出力してください。`;

    try {
      // モデル一覧を取得
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      if (!mRes.ok) throw new Error(mData.error?.message);

      // 日本語に強く、Google検索が使えるGeminiモデルを優先
      let models = mData.models
        .filter(m => m.name.includes("gemini") && m.supportedGenerationMethods.includes("generateContent"))
        .sort((a, b) => b.name.localeCompare(a.name));

      const lastModel = localStorage.getItem('last_asset_model');
      if (lastModel && models.some(m => m.name === lastModel)) {
        models = [{name: lastModel}, ...models.filter(m => m.name !== lastModel)];
      }

      let success = false;
      for (const m of models) {
        statusMsg.textContent = `試行中: ${m.name.split('/').pop()}...`;
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              // ★ Google検索ツールを有効化！
              tools: [{ google_search: {} }]
            })
          });

          const data = await response.json();
          if (response.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            resultBox.innerText = data.candidates[0].content.parts[0].text;
            localStorage.setItem('last_asset_model', m.name);
            success = true;
            break;
          }
        } catch (e) { console.warn(e); }
      }

      if (!success) resultBox.innerText = "情報の取得に失敗しました。時間をおいて再試行してください。";
    } catch (err) {
      resultBox.innerText = "エラー: " + err.message;
    } finally {
      loading.style.display = 'none';
      searchBtn.disabled = false;
      statusMsg.textContent = success ? "分析完了" : "失敗";
    }
  }
</script>

</body>
</html>
